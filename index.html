<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Into the Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: Arial, sans-serif;
            font-size: 18px;
            text-align: center;
            opacity: 1;
            transition: opacity 1s;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        #instructions.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="instructions">Move your mouse to journey into the image</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Add lighting for displacement mapping
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(5, 5, 10);
        scene.add(directionalLight);

        // Load the image as a texture
        const textureLoader = new THREE.TextureLoader();
        let imagePlane;
        let imageAspect;

        // Load both color and depth textures
        const colorTexture = textureLoader.load('image.jpeg');
        const depthTexture = textureLoader.load('depth.png');

        textureLoader.load('image.jpeg', (texture) => {
            // Calculate aspect ratio to maintain image proportions
            imageAspect = texture.image.width / texture.image.height;

            // Create a HIGHLY subdivided plane geometry for displacement
            // More segments = smoother 3D effect
            const planeHeight = 10;
            const planeWidth = planeHeight * imageAspect;
            const geometry = new THREE.PlaneGeometry(
                planeWidth,
                planeHeight,
                512,  // width segments - more = smoother
                512   // height segments - more = smoother
            );

            // Use MeshStandardMaterial for proper lighting and displacement
            const material = new THREE.MeshStandardMaterial({
                map: colorTexture,
                displacementMap: depthTexture,
                displacementScale: 2.5,  // Adjust this to control depth intensity
                metalness: 0.0,
                roughness: 1.0,
                side: THREE.DoubleSide
            });

            imagePlane = new THREE.Mesh(geometry, material);
            scene.add(imagePlane);

            // Start camera far away to show full image
            camera.position.z = 15;
            camera.position.y = 0;
            camera.lookAt(0, 0, 0);
        });

        // Mouse tracking
        let totalMouseMovement = 0;
        let lastMouseX = window.innerWidth / 2;
        let lastMouseY = window.innerHeight / 2;
        let targetZoom = 0;
        const maxZoom = 1; // 0 to 1, where 1 is fully zoomed in

        document.addEventListener('mousemove', (event) => {
            const deltaX = event.clientX - lastMouseX;
            const deltaY = event.clientY - lastMouseY;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

            totalMouseMovement += distance;
            lastMouseX = event.clientX;
            lastMouseY = event.clientY;

            // Map total mouse movement to zoom (0 to 1)
            // Adjust the divisor to control how much mouse movement is needed
            targetZoom = Math.min(totalMouseMovement / 3000, maxZoom);

            // Hide instructions after some movement
            if (totalMouseMovement > 100) {
                document.getElementById('instructions').classList.add('hidden');
            }
        });

        // Animation
        function animate() {
            requestAnimationFrame(animate);

            if (imagePlane) {
                // Smooth interpolation of zoom
                const currentZoom = camera.position.z;

                // Calculate target camera position
                // Start at z=15 (far), end at z=3 (close enough to see 3D depth)
                const startZ = 15;
                const endZ = 3;
                const targetZ = startZ + (endZ - startZ) * targetZoom;

                // Move camera towards target
                camera.position.z += (targetZ - currentZoom) * 0.05;

                // As we zoom in, move camera down to focus on the feet
                // The feet are at the bottom of the image
                const startY = 0;
                const endY = -4; // Negative Y to focus on bottom of image
                const targetY = startY + (endY - startY) * targetZoom;

                camera.position.y += (targetY - camera.position.y) * 0.05;

                // Add subtle horizontal rotation to see the 3D depth effect
                const startX = 0;
                const endX = 1; // Slight offset to view from angle
                const targetX = startX + (endX - startX) * targetZoom;
                camera.position.x += (targetX - camera.position.x) * 0.05;

                camera.lookAt(0, targetY, 0);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
