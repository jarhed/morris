<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Journey Into the Image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            font-size: 14px;
            text-align: center;
            opacity: 1;
            transition: opacity 1s;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            padding: 0 20px;
            max-width: 90%;
            line-height: 1.4;
        }

        @media (min-width: 768px) {
            #instructions {
                font-size: 18px;
            }
        }

        #instructions.hidden {
            opacity: 0;
        }

        #static-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease-out;
            cursor: pointer;
        }

        #static-view img {
            max-width: 90%;
            max-height: 80vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.5s ease;
        }

        #static-view:hover img {
            transform: scale(1.02);
        }

        #static-view p {
            color: rgba(255, 255, 255, 0.6);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        #static-view.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="static-view">
        <img src="image.jpeg" alt="Journey Into the Image">
        <p id="enter-text">Loading...</p>
    </div>
    <div id="instructions" class="hidden"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        scene.fog = new THREE.FogExp2(0x000000, 0.03); // Add atmospheric fog

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance'
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for mobile
        // document.body.appendChild(renderer.domElement); // Deferred until start

        // Add lighting for displacement mapping
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 5, 10);
        scene.add(directionalLight);

        // Add floating particles for immersion
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 2000;
        const posArray = new Float32Array(particlesCount * 3);

        for (let i = 0; i < particlesCount * 3; i++) {
            // Spread particles in a large volume around the center
            posArray[i] = (Math.random() - 0.5) * 40;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0xffffff,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Load the image as a texture
        const textureLoader = new THREE.TextureLoader();
        let imagePlane;
        let imageAspect;

        // Load both color and depth textures
        const colorTexture = textureLoader.load('image_expanded.png');
        const depthTexture = textureLoader.load('depth_huggingface.png');

        textureLoader.load('image_expanded.png', (texture) => {
            // Calculate aspect ratio to maintain image proportions
            imageAspect = texture.image.width / texture.image.height;

            // Create a HIGHLY subdivided plane geometry for displacement
            // More segments = smoother 3D effect
            const planeHeight = 10;
            const planeWidth = planeHeight * imageAspect;
            const geometry = new THREE.PlaneGeometry(
                planeWidth,
                planeHeight,
                512,  // width segments - more = smoother
                512   // height segments - more = smoother
            );

            // Use MeshStandardMaterial for proper lighting and displacement
            const material = new THREE.MeshStandardMaterial({
                map: colorTexture,
                displacementMap: depthTexture,
                displacementScale: 6,  // Adjust this to control depth intensity
                metalness: 0.0,
                roughness: 1.0,
                side: THREE.DoubleSide
            });

            imagePlane = new THREE.Mesh(geometry, material);
            scene.add(imagePlane);

            // Start camera far away to show full image
            camera.position.z = 15;
            camera.position.y = 0;
            camera.lookAt(0, 0, 0);

            // Mark as loaded and enable interaction
            isLoaded = true;
            const enterText = document.getElementById('enter-text');
            enterText.textContent = 'Click to Enter';
            enterText.style.opacity = '1';
            enterText.style.cursor = 'pointer';
        });

        // Detect if touch device and set instructions
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        const instructionsEl = document.getElementById('instructions');
        instructionsEl.textContent = isTouchDevice
            ? 'Touch and drag to look around • Pinch to zoom'
            : 'Move mouse to look around • Scroll to zoom';

        // Mouse/touch tracking - orbit around figure with scroll/pinch to zoom
        let mouseX = 0.5;
        let mouseY = 0.5;
        let targetDistance = 7; // Start far away
        let hasInteracted = false;

        document.addEventListener('mousemove', (event) => {
            hasInteracted = true;

            // Normalize mouse position to 0-1 range
            mouseX = event.clientX / window.innerWidth;
            mouseY = event.clientY / window.innerHeight;

            // Hide instructions after first interaction
            if (hasInteracted) {
                instructionsEl.classList.add('hidden');
            }
        });

        // Touch move support
        document.addEventListener('touchmove', (event) => {
            event.preventDefault(); // Prevent scrolling/pull-to-refresh
            hasInteracted = true;

            if (event.touches.length === 1) {
                // Single touch - look around
                const touch = event.touches[0];
                mouseX = touch.clientX / window.innerWidth;
                mouseY = touch.clientY / window.innerHeight;
            }

            // Hide instructions after first interaction
            if (hasInteracted) {
                instructionsEl.classList.add('hidden');
            }
        }, { passive: false });

        // Scroll wheel zoom
        document.addEventListener('wheel', (event) => {
            event.preventDefault();
            hasInteracted = true;

            // Adjust target distance based on scroll direction
            const zoomSpeed = 0.5;
            targetDistance += event.deltaY * 0.01 * zoomSpeed;

            // Clamp distance between 1 and 20
            targetDistance = Math.max(1, Math.min(20, targetDistance));

            // Hide instructions
            if (hasInteracted) {
                instructionsEl.classList.add('hidden');
            }
        }, { passive: false });

        // Pinch-to-zoom support for mobile
        let lastTouchDistance = null;

        document.addEventListener('touchstart', (event) => {
            if (event.touches.length === 2) {
                // Record initial distance between two touches
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                lastTouchDistance = Math.sqrt(dx * dx + dy * dy);
            }
        }, { passive: true });

        document.addEventListener('touchmove', (event) => {
            if (event.touches.length === 2) {
                event.preventDefault(); // Prevent default pinch zoom
                hasInteracted = true;

                // Calculate current distance between two touches
                const dx = event.touches[0].clientX - event.touches[1].clientX;
                const dy = event.touches[0].clientY - event.touches[1].clientY;
                const currentDistance = Math.sqrt(dx * dx + dy * dy);

                if (lastTouchDistance) {
                    // Pinch gesture - adjust zoom
                    const delta = lastTouchDistance - currentDistance;
                    const zoomSpeed = 0.05;
                    targetDistance += delta * zoomSpeed;

                    // Clamp distance between 1 and 20
                    targetDistance = Math.max(1, Math.min(20, targetDistance));
                }

                lastTouchDistance = currentDistance;

                // Hide instructions
                if (hasInteracted) {
                    instructionsEl.classList.add('hidden');
                }
            }
        }, { passive: false });

        document.addEventListener('touchend', () => {
            lastTouchDistance = null;
        }, { passive: true });

        // Camera orbit parameters
        let currentDistance = 15;
        let currentTheta = Math.PI / 2; // Start at PI/2 (Front view)
        let currentPhi = Math.PI / 2;

        // Center point to orbit around (the figure's position)
        const orbitCenter = new THREE.Vector3(0, 0, 0);

        // Animation
        function animate() {
            requestAnimationFrame(animate);

            if (imagePlane) {
                // Smoothly interpolate to target distance
                currentDistance += (targetDistance - currentDistance) * 0.08;

                // Orbital angles based on mouse position
                // Mouse X controls horizontal rotation (theta): -PI to +PI
                // Offset by PI/2 so that center (0.5) maps to PI/2 (Front view, Z-axis)
                const targetTheta = (mouseX - 0.5) * Math.PI * 2 + Math.PI / 2;
                currentTheta += (targetTheta - currentTheta) * 0.08;

                // Mouse Y controls vertical angle (phi): PI/4 to 3*PI/4
                // This keeps camera from going too high or too low
                const targetPhi = Math.PI / 4 + mouseY * (Math.PI / 2);
                currentPhi += (targetPhi - currentPhi) * 0.08;

                // Convert spherical coordinates to Cartesian
                const targetX = orbitCenter.x + currentDistance * Math.sin(currentPhi) * Math.cos(currentTheta);
                const targetY = orbitCenter.y + currentDistance * Math.cos(currentPhi);
                const targetZ = orbitCenter.z + currentDistance * Math.sin(currentPhi) * Math.sin(currentTheta);

                // Update camera position
                camera.position.x = targetX;
                camera.position.y = targetY;
                camera.position.z = targetZ;

                // Always look at the center (the figure)
                camera.lookAt(orbitCenter);

                // Animate particles
                if (particlesMesh) {
                    particlesMesh.rotation.y += 0.0005;
                    particlesMesh.rotation.x += 0.0002;
                }
            }

            renderer.render(scene, camera);
        }

        // animate(); // Deferred until start

        // Start experience handler
        const staticView = document.getElementById('static-view');
        let isLoaded = false;

        staticView.addEventListener('click', () => {
            if (!isLoaded) return;

            staticView.classList.add('hidden');
            document.body.appendChild(renderer.domElement);

            // Show instructions briefly
            const instructions = document.getElementById('instructions');
            instructions.classList.remove('hidden');

            animate();
        });

        // Function to return to static view
        function exit3DView() {
            const staticView = document.getElementById('static-view');
            if (staticView.classList.contains('hidden')) {
                staticView.classList.remove('hidden');

                // Reset instructions
                const instructions = document.getElementById('instructions');
                instructions.classList.remove('hidden');
                hasInteracted = false;
            }
        }

        // Click to return to static view
        renderer.domElement.addEventListener('click', exit3DView);

        // Escape key to return to static view
        window.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                exit3DView();
            }
        });

        // Handle window resize and orientation change
        function handleResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
    </script>
</body>

</html>
